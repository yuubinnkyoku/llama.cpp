name: Hexagon low-bit host regression

on:
  push:
    branches:
      - hexagon-iq2s
    paths:
      - "ggml/src/ggml-hexagon/iq2-s-repack.h"
      - "tests/test-hexagon-iq2-s-repack.cpp"
      - "tests/CMakeLists.txt"
      - "docs/backend/snapdragon/iq2-s-repack.md"
      - ".github/workflows/iq2-s-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLLAMA_BUILD_TESTS=ON
          -DGGML_NATIVE=OFF

      - name: Build low-bit host tests
        run: cmake --build build --target test-hexagon-iq2-s-repack test-hexagon-iq3-s-repack test-hexagon-q2-k-repack test-backend-ops -j2

      - name: Run low-bit host regression
        run: ctest --test-dir build -R '^test-hexagon-(iq2-s|iq3-s|q2-k)-repack$' --output-on-failure
